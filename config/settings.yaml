# Single source of truth for all tunable parameters.
# No logic module may hardcode any of these values.

hello: "cross-league-translation is alive"

random_seed: 42

# League-strength anchor: factors are expressed relative to this league (= 1.0)
anchor_league: MLS

# Seasons pulled per source (inclusive range, expanded in code)
seasons:
  asa:
    start: 2018
    end: 2025
  fbref:
    start: 2018
    end: 2025
  # the free API-Football plan only serves these seasons (API error names the window)
  api_football:
    start: 2022
    end: 2024

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_crosswalk: data/crosswalk
  data_outputs: data/outputs
  docs_contracts: docs/contracts

ingest:
  # Seconds to sleep between consecutive live API calls (ASA asks for modest use)
  rate_limit_seconds: 1.0
  max_retries: 3
  backoff_base_seconds: 2.0
  # spacing between FBref page loads (stay well under the site's rate limits)
  fbref_page_delay_seconds: 6.0
  # FBref pages sit behind bot protection that can demand an interactive
  # verification click, so live FBref fetching is OPT-IN. The pipeline runs fully
  # unattended on ASA + Understat; already-cached FBref slices are always used.
  fbref_fetch_enabled: false

api_football:
  base_url: https://v3.football.api-sports.io
  # key is read from the API_FOOTBALL_KEY env var or the gitignored .env file
  key_env_var: API_FOOTBALL_KEY
  # requests left untouched each day (manual probes, retries)
  daily_reserve: 5
  # free plan caps requests per minute; 7s spacing stays under 10/min
  request_delay_seconds: 7.0
  # free plan rejects page > 3, so players are pulled per team (a squad fits in 3
  # pages of 20); a team needing more is reported as truncated
  max_page: 3
  timeout_seconds: 30

crosswalk:
  # rapidfuzz token_sort_ratio threshold (0-100) for an auto-accepted match
  accept_threshold: 88
  # below this, never match
  reject_threshold: 70
  # precision target on the labeled fixture, asserted in tests
  fixture_precision_target: 0.90
  # audit sample sizes
  audit_random_n: 25
  audit_low_confidence_n: 25

movers:
  # minimum minutes in the ORIGIN season of a move (trustworthy pre-move baseline)
  min_minutes_qualifying: 900
  # minimum minutes in the DESTINATION season: lower, to pull partial failures into
  # the sample (survivorship mitigation); noise is handled by minutes-weighting
  min_minutes_destination: 450
  # league pairs with fewer movers than this are flagged too-thin-to-calibrate
  thin_pair_floor: 5
  # a move only counts if the destination season starts within this many seasons
  # of the origin season (longer gaps confound league effect with career drift)
  max_season_gap: 2

calibration:
  # metrics used to estimate conversion factors (must be positive rates; movers with
  # a non-positive value on either side of a move are excluded from ratios and logged)
  metrics:
   - xg_xa_per90
   - goals_added_raw_per90
  # shrinkage prior strength: mean log-ratio is scaled by n / (n + k), i.e. pulled
  # toward log(1.0)=0 for small samples
  shrinkage_k: 4
  # subtract the expected age-driven metric change from each mover's delta before
  # estimating factors
  age_adjust: true
  # movers without a known birth year (mostly intra-European, where age profiles of
  # moves are roughly symmetric): 'keep' = retain with unadjusted delta (flagged and
  # counted), 'exclude' = drop them entirely
  age_adjust_unknown: keep
  # shrinkage for per-age aging-curve buckets (bucket mean scaled by n/(n+k))
  aging_shrinkage_k: 25
  bootstrap_iterations: 1000
  # confidence interval width
  ci_level: 0.90

validation:
  # a mover "succeeds" post-move if they retain at least this share of pre-move minutes-per-season
  success_min_minutes_share: 0.5
  # ... and their strength-adjusted primary metric does not fall by more than this fraction
  success_max_metric_drop: 0.25
  # primary metric used for the proof-of-concept projection
  primary_metric: goals_added_raw_per90
  # held-out share of movers for retrodiction
  holdout_fraction: 0.5
  permutation_iterations: 2000
