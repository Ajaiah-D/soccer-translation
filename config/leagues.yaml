# League registry: canonical code -> per-source identifiers.
# Canonical codes are used everywhere downstream; source-specific codes only in ingest.

leagues:
  MLS:
    name: Major League Soccer
    asa: mls
    fbref: USA-Major League Soccer
    fbref_comp_id: 22
    fbref_slug: Major-League-Soccer
    fbref_season_style: calendar
    group: mens
    tier: us_1
  USLC:
    name: USL Championship
    asa: uslc
    fbref: null
    group: mens
    tier: us_2
  USL1:
    name: USL League One
    asa: usl1
    fbref: null
    group: mens
    tier: us_3
  MLSNP:
    name: MLS NEXT Pro
    asa: mlsnp
    fbref: null
    group: mens
    tier: us_3
  NWSL:
    name: National Women's Soccer League
    asa: nwsl
    fbref: null
    group: womens
    tier: usw_1
  USLS:
    name: USL Super League
    asa: usls
    fbref: null
    group: womens
    tier: usw_1

# European comparison leagues via FBref only (kept small to respect scraping limits)
  ENG1:
    name: Premier League
    asa: null
    fbref: ENG-Premier League
    fbref_comp_id: 9
    fbref_slug: Premier-League
    fbref_season_style: cross
    understat: EPL
    group: mens
    tier: eng_1

# Strong footballing priors used by the Phase 4 monotonicity gate:
# each entry means "left league is stronger than right league" for men's pyramid metrics.
strength_priors:
  - [MLS, USLC]
  - [USLC, USL1]
  - [MLS, MLSNP]
  - [ENG1, MLS]
