# League registry: canonical code -> per-source identifiers.
# Canonical codes are used everywhere downstream; source-specific codes only in ingest.

leagues:
  MLS:
    name: Major League Soccer
    asa: mls
    fbref: USA-Major League Soccer
    fbref_comp_id: 22
    fbref_slug: Major-League-Soccer
    fbref_season_style: calendar
    spi: Major League Soccer
    group: mens
    tier: us_1
  USLC:
    name: USL Championship
    asa: uslc
    fbref: null
    group: mens
    tier: us_2
  USL1:
    name: USL League One
    asa: usl1
    fbref: null
    group: mens
    tier: us_3
  MLSNP:
    name: MLS NEXT Pro
    asa: mlsnp
    fbref: null
    group: mens
    tier: us_3
  NWSL:
    name: National Women's Soccer League
    asa: nwsl
    fbref: null
    group: womens
    tier: usw_1
  USLS:
    name: USL Super League
    asa: usls
    fbref: null
    group: womens
    tier: usw_1

# European comparison leagues (Understat: fully automatic player xG/xA;
# FBref ids kept for the cached historical slices)
  ENG1:
    name: Premier League
    asa: null
    fbref: ENG-Premier League
    fbref_comp_id: 9
    fbref_slug: Premier-League
    fbref_season_style: cross
    understat: EPL
    spi: Barclays Premier League
    group: mens
    tier: eng_1
  GER1:
    name: Bundesliga
    asa: null
    fbref: null
    understat: Bundesliga
    spi: German Bundesliga
    group: mens
    tier: ger_1
  ESP1:
    name: La Liga
    asa: null
    fbref: null
    understat: La_liga
    spi: Spanish Primera Division
    group: mens
    tier: esp_1
  ITA1:
    name: Serie A
    asa: null
    fbref: null
    understat: Serie_A
    spi: Italy Serie A
    group: mens
    tier: ita_1
  FRA1:
    name: Ligue 1
    asa: null
    fbref: null
    understat: Ligue_1
    spi: French Ligue 1
    group: mens
    tier: fra_1

# Anchor-only leagues: no open per-player data source, included so the SPI anchor
# can report their relative strength; they never enter the mover calibration.
  ENG2:
    name: EFL Championship
    asa: null
    fbref: null
    spi: English League Championship
    anchor_only: true
    group: mens
    tier: eng_2
  GER2:
    name: 2. Bundesliga
    asa: null
    fbref: null
    spi: German 2. Bundesliga
    anchor_only: true
    group: mens
    tier: ger_2

# Strong footballing priors used by the Phase 4 monotonicity gate:
# each entry means "left league is stronger than right league" for men's pyramid metrics.
strength_priors:
  - [MLS, USLC]
  - [USLC, USL1]
  - [MLS, MLSNP]
  - [ENG1, MLS]
  - [GER1, MLS]
  - [ESP1, MLS]
  - [ITA1, MLS]
  - [FRA1, MLS]
