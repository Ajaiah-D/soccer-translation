# Anchor-only leagues: no open per-player data source, included so the SPI anchor
# can report their relative strength; they never enter the mover calibration.
# (ENG2 now has API-Football player data being backfilled; it stays anchor-only until
# that catalog is integrated into harmonize/calibration.)
  ENG2:
    name: EFL Championship
    api_football: 40
    asa: null
    fbref: null
    spi: English League Championship
